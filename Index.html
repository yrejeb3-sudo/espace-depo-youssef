<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
   <script>
    moy=prompt("Entrer votre Moyenne")
    if (moy>=10)
    {
        alert("Vous êtes admis")
    }
    else if (moy>=7 && moy<10)
    {
        alert("Vous êtes en rattrapage")
    }
    else
    {
        alert("Vous êtes recalé")
    }
    
    
   </script>
</body>
</html>
